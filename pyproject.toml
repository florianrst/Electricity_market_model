[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emm"
version = "0.1.0"
description = "Electricity market model: data ingestion, ETL and forecasting for France"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "pyarrow",
    "duckdb",
    "pyyaml",
    "python-dotenv",
    "requests",
    "httpx",
    "tenacity",
    "typer",
    "holidays",
    "matplotlib",
    "seaborn",
    "plotly",
    "jupyterlab",
    "ipykernel",
    "ipywidgets",
]

[project.optional-dependencies]
ml = ["lightgbm", "xgboost"]
dl = ["torch"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
